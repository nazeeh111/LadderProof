[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ladderproof"
version = "0.1.1"
description = "Exact static R-2R DAC tolerance bounds with an independent complete verifier"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nazeeh Abdul-Hadi"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
ladderproof = "ladderproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ladderproof = ["assets/*"]
